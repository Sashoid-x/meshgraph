[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshgraph"
version = "0.1.0"
description = "Standalone Meshtastic node-graph viewer fed directly from an MQTT broker"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "paho-mqtt>=2.1.0",
    "meshtastic>=2.7.8",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
meshgraph = "meshgraph.web:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "quickjs>=1.19",
]

[tool.hatch.build.targets.wheel]
packages = ["meshgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
